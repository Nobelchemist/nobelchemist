<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nobel Chemist — عناية مستوحاة من الطبيعة</title>
  <meta name="description" content="تابعوا Nobel Chemist على إنستغرام وفيسبوك وواتساب، وزوروا موقعنا الإلكتروني." />

  <!-- Open Graph -->
  <meta property="og:title" content="Nobel Chemist" />
  <meta property="og:description" content="عناية مستوحاة من الطبيعة" />
  <meta property="og:image" content="nobel-logo.png" />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/png" href="nobel-logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --em-100: #E7F7EC;
      --em-300: #63D38F;
      --em-500: #19B866;
      --em-700: #0B7A42;
      --em-800: #07552F;
      --em-900: #04351F;
      --em-950: #011A0E;
      --gold: #D7B56D;
      --glass: rgba(255,255,255,0.095);
      --glass-border: rgba(255,255,255,0.19);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 70% 45% at 18% 8%,  rgba(56,210,100,.30), transparent 58%),
        radial-gradient(ellipse 55% 50% at 88% 78%, rgba(11,122,66,.38), transparent 60%),
        radial-gradient(ellipse 80% 60% at 50% 110%, rgba(4,53,31,.9), transparent 70%),
        linear-gradient(160deg,
          #19b866 0%,
          #0f7a42 22%,
          #07552f 46%,
          #04351f 68%,
          #011a0e 100%
        );
      font-family: 'IBM Plex Sans Arabic', 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      color: #fff;
    }

    /* Subtle noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 180px 180px;
      opacity: 0.045;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      right: -200px;
      bottom: -250px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(31,190,104,.18), transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .branch {
      position: fixed;
      top: -20px;
      right: -50px;
      width: 220px;
      height: 340px;
      opacity: .11;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 34px 22px 28px;
    }

    /* ── Logo ── */
    /* ── Logo ── */
    .logo-wrap {
      position: relative;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      isolation: isolate;
    }

    /* Green glow behind logo */
    .logo-wrap::before {
      content: '';
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(45,184,78,.38) 0%, rgba(19,161,85,.12) 50%, transparent 72%);
      filter: blur(22px);
      z-index: -1;
    }

    .logo-frame {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-frame img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      object-position: center;
      display: block;
      filter: drop-shadow(0 8px 28px rgba(0,0,0,.45));
    }

    .tagline { text-align: center; margin-bottom: 10px; }
    .tagline .ar {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      font-size: clamp(22px, 6vw, 26px);
      font-weight: 700;
      color: #fff;
      line-height: 1.45;
      text-shadow: 0 3px 18px rgba(0,0,0,.3);
    }
    .tagline .en {
      font-family: 'Poppins', sans-serif;
      font-style: italic;
      font-size: 12px;
      font-weight: 500;
      color: var(--em-100);
      letter-spacing: 1.8px;
      margin-top: 7px;
      opacity: .92;
    }
    .divider {
      width: 58px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
      border-radius: 5px;
      margin: 15px auto 0;
      opacity: .9;
    }

    .links { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .link-card {
      display: flex;
      align-items: center;
      gap: 15px;
      min-height: 76px;
      padding: 13px 16px;
      background: linear-gradient(110deg, rgba(255,255,255,.13), rgba(255,255,255,.055));
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      text-decoration: none;
      color: #fff;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 9px 22px rgba(0,0,0,.17);
      transition: transform .22s ease, background .22s ease, box-shadow .22s ease, border-color .22s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .link-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, rgba(255,255,255,.1), transparent 42%);
      pointer-events: none;
    }
    .link-card:hover, .link-card:focus-visible {
      transform: translateY(-3px);
      background: linear-gradient(110deg, rgba(255,255,255,.2), rgba(255,255,255,.09));
      border-color: rgba(255,255,255,.38);
      box-shadow: 0 1px 0 rgba(255,255,255,.16) inset, 0 16px 30px rgba(0,0,0,.28);
    }
    .link-card:focus-visible { outline: 2px solid rgba(255,255,255,.75); outline-offset: 3px; }
    .link-card:active { transform: translateY(-1px); }
    .link-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 5px 12px rgba(0,0,0,.18), 0 1px 0 rgba(255,255,255,.25) inset;
    }
    .link-icon.instagram { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .link-icon.website { background: linear-gradient(135deg, #1a7a38, #2db84e); }
    .link-icon.facebook { background: linear-gradient(135deg, #1877f2, #0c5fcc); }
    .link-icon.whatsapp { background: linear-gradient(135deg, #25d366, #128c7e); }
    .link-text { flex: 1; text-align: right; }
    .link-text .label { font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 15.5px; font-weight: 700; color: #fff; line-height: 1.3; }
    .link-text .sublabel { font-family: 'Poppins', sans-serif; font-size: 10px; font-weight: 400; color: rgba(255,255,255,.58); margin-top: 4px; letter-spacing: .65px; direction: ltr; text-align: right; }
    .link-arrow { color: rgba(255,255,255,.58); font-size: 22px; line-height: 1; flex-shrink: 0; transition: transform .2s ease; }
    .link-card:hover .link-arrow { transform: translateX(-3px); color: #fff; }

    .footer { margin-top: 24px; padding-top: 0; text-align: center; }
    .footer p { font-family: 'Poppins', sans-serif; font-size: 9.5px; font-weight: 500; color: rgba(255,255,255,.4); letter-spacing: 2.2px; }
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .dot { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,.15); animation: float linear infinite; }
    @keyframes float { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: .6; } 100% { transform: translateY(-20px) scale(1); opacity: 0; } }
   /* ── تحسينات الشاشات المتوسطة والصغيرة للهواتف ── */
@media (max-width: 480px) {
  .container {
    padding: 24px 16px 20px;
  }
  .logo-frame img {
    width: 155px;
    height: 155px;
  }
  .tagline .ar {
    font-size: 20px;
  }
  .link-card {
    min-height: 68px;
    padding: 10px 14px;
    gap: 12px;
  }
  .link-icon {
    width: 42px;
    height: 42px;
  }
}

@media (max-width: 360px) {
  .logo-frame img {
    width: 135px;
    height: 135px;
  }
  .tagline .ar {
    font-size: 18px;
  }
  .link-text .label {
    font-size: 14px;
  }
}

/* ── تقليل الحركة للمستخدمين الذين يفضلون ذلك ── */
@media (prefers-reduced-motion: reduce) {
  .dot { display: none; }
  .link-card, .link-arrow { transition: none; }
}
  </style>
</head>
